<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">NexcoreWork 本地数据存储架构</title>
  <desc id="desc">桌面界面通过本地服务访问 SQLite 数据库和项目工作区。SQLite 保存设置、加密密钥、会话与用量，工作区保存附件、产物和项目记忆，并可导出或备份。</desc>
  <defs>
    <marker id="arrow-storage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#0b8797"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="#f7fbfc"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="54" y="78" width="192" height="360" rx="22" fill="#10272f"/>
    <text x="84" y="120" font-size="13" font-weight="700" fill="#6fe5be" letter-spacing="1.3">DESKTOP</text>
    <text x="84" y="158" font-size="22" font-weight="700" fill="#f4fbfc">NexcoreWork</text>
    <rect x="84" y="186" width="132" height="40" rx="9" fill="#183842"/>
    <text x="102" y="212" font-size="15" fill="#d7e9ed">对话与工作区</text>
    <rect x="84" y="238" width="132" height="40" rx="9" fill="#183842"/>
    <text x="102" y="264" font-size="15" fill="#d7e9ed">设置与权限</text>
    <rect x="84" y="290" width="132" height="40" rx="9" fill="#183842"/>
    <text x="102" y="316" font-size="15" fill="#d7e9ed">模型与服务</text>
    <text x="84" y="380" font-size="13" fill="#bad3d9">Windows 10 / 11</text>

    <g id="n:local-service">
      <circle cx="410" cy="258" r="98" fill="#e5f8f4" stroke="#4ed4b1" stroke-width="2"/>
      <circle cx="410" cy="258" r="67" fill="#ffffff" stroke="#9bdfd0"/>
      <text x="410" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#0b7d6c" letter-spacing="1">LOCAL SERVICE</text>
      <text x="410" y="272" text-anchor="middle" font-size="20" font-weight="700" fill="#18323b">本地服务</text>
      <text x="410" y="296" text-anchor="middle" font-size="13" fill="#58737d">权限校验 · 文件访问</text>
    </g>

    <rect x="650" y="72" width="252" height="184" rx="20" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
    <text x="678" y="108" font-size="13" font-weight="700" fill="#0d7387" letter-spacing="1.3">SQLITE</text>
    <text x="678" y="140" font-size="21" font-weight="700" fill="#18323b">应用状态数据库</text>
    <text x="678" y="176" font-size="14" fill="#58737d">设置 · 会话 · 用量 · 价格</text>
    <text x="678" y="203" font-size="14" fill="#58737d">API Key 加盐慢哈希加密</text>
    <text x="678" y="230" font-size="14" fill="#58737d">重启后恢复</text>

    <rect x="650" y="286" width="252" height="194" rx="20" fill="#ecfaef" stroke="#8fdbad" stroke-width="1.5"/>
    <text x="678" y="322" font-size="13" font-weight="700" fill="#2b8a55" letter-spacing="1.3">WORKSPACE</text>
    <text x="678" y="354" font-size="21" font-weight="700" fill="#18323b">项目文件</text>
    <text x="678" y="389" font-size="14" fill="#58737d">附件 · 产物 · 行级变更</text>
    <text x="678" y="416" font-size="14" fill="#58737d">.NexcoreWork 项目记忆</text>
    <text x="678" y="443" font-size="14" fill="#58737d">可备份 · 可迁移 · 可删除</text>

    <g fill="none" stroke="#0b8797" stroke-width="2.4" marker-end="url(#arrow-storage)">
      <path d="M246 258h62"/>
      <path d="M508 226h68v-62h68"/>
      <path d="M508 290h68v92h68"/>
    </g>
    <path d="M246 438h278" fill="none" stroke="#18b795" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="260" y="466" font-size="14" fill="#466873">导出与备份不改变工作区结构</text>
  </g>
</svg>
