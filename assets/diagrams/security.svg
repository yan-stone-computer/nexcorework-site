<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">NexcoreWork 工具权限与工作区边界</title>
  <desc id="desc">工具请求先经过权限策略。普通操作进入工具执行层，高风险操作先经过内容绑定审批。文件、命令、网络和密钥工具的结果全部进入审计记录。</desc>
  <defs>
    <marker id="arrow-security" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#0b8797"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="#f7fbfc"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <g id="n:request">
      <rect x="42" y="204" width="150" height="138" rx="20" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <circle cx="117" cy="242" r="23" fill="#e2f7f5"/>
      <path d="M106 239h22M106 247h16M106 255h10" stroke="#0aa8cf" stroke-width="2.2" stroke-linecap="round"/>
      <text x="117" y="289" text-anchor="middle" font-size="19" font-weight="700" fill="#18323b">工具请求</text>
      <text x="117" y="314" text-anchor="middle" font-size="13" fill="#58737d">参数与目标路径</text>
    </g>

    <g id="n:policy">
      <rect x="230" y="174" width="184" height="198" rx="22" fill="#10272f"/>
      <text x="258" y="212" font-size="13" font-weight="700" fill="#6fe5be" letter-spacing="1.2">POLICY ENGINE</text>
      <text x="258" y="246" font-size="20" font-weight="700" fill="#effaf9">权限策略</text>
      <text x="258" y="278" font-size="13" fill="#bad3d9">工作区路径钳制</text>
      <text x="258" y="302" font-size="13" fill="#bad3d9">工具与网络授权</text>
      <text x="258" y="326" font-size="13" fill="#bad3d9">服务端二次校验</text>
    </g>

    <g id="n:approval">
      <rect x="468" y="56" width="214" height="120" rx="18" fill="#e8faf5" stroke="#54d0b1" stroke-width="2"/>
      <text x="496" y="88" font-size="13" font-weight="700" fill="#0b7d6c" letter-spacing="1.1">HIGH RISK · APPROVAL</text>
      <text x="496" y="117" font-size="18" font-weight="700" fill="#18323b">审批绑定当前内容</text>
      <text x="496" y="141" font-size="12" fill="#58737d">仅高风险工具触发</text>
      <text x="496" y="161" font-size="12" fill="#58737d">工具、参数与影响范围</text>
    </g>

    <g id="n:tools">
      <rect x="468" y="194" width="258" height="284" rx="20" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <text x="496" y="225" font-size="13" font-weight="700" fill="#0d7387" letter-spacing="1.2">TOOL EXECUTION</text>
      <rect x="492" y="244" width="210" height="46" rx="9" fill="#eef8f8"/>
      <text x="512" y="272" font-size="16" font-weight="700" fill="#18323b">文件工具</text>
      <text x="620" y="272" font-size="12" fill="#58737d">仅限工作区路径</text>
      <rect x="492" y="298" width="210" height="46" rx="9" fill="#eef8f8"/>
      <text x="512" y="326" font-size="16" font-weight="700" fill="#18323b">命令工具</text>
      <text x="620" y="326" font-size="12" fill="#58737d">固定工作目录</text>
      <rect x="492" y="352" width="210" height="46" rx="9" fill="#eef8f8"/>
      <text x="512" y="380" font-size="16" font-weight="700" fill="#18323b">网络工具</text>
      <text x="620" y="380" font-size="12" fill="#58737d">按工具授权访问</text>
      <rect x="492" y="406" width="210" height="46" rx="9" fill="#ecfaef"/>
      <text x="512" y="434" font-size="16" font-weight="700" fill="#18323b">密钥读取</text>
      <text x="620" y="434" font-size="12" fill="#58737d">解密 · 输出脱敏</text>
    </g>

    <g id="n:audit">
      <rect x="780" y="224" width="138" height="156" rx="18" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <text x="808" y="260" font-size="13" font-weight="700" fill="#0d7387" letter-spacing="1.1">AUDIT</text>
      <text x="808" y="291" font-size="18" font-weight="700" fill="#18323b">审计回执</text>
      <text x="808" y="319" font-size="12" fill="#58737d">参数摘要</text>
      <text x="808" y="341" font-size="12" fill="#58737d">耗时 · 退出码</text>
      <text x="808" y="363" font-size="12" fill="#58737d">文件变化</text>
    </g>

    <g fill="none" stroke="#0b8797" stroke-width="2.4" marker-end="url(#arrow-security)">
      <path d="M192 273h38"/>
      <path d="M414 228h20V112h34"/>
      <path d="M414 293h54"/>
      <path d="M575 176v18"/>
      <path d="M726 336h54"/>
    </g>
    <circle cx="434" cy="228" r="4" fill="#35d2aa"/>
  </g>
</svg>
