<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑单车动画</title>
  <desc id="desc">一只戴头盔、系围巾的鹈鹕在乡间道路上骑自行车，车轮、曲柄与路面持续转动。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8eddc"/>
      <stop offset=".58" stop-color="#d9e3c9"/>
      <stop offset="1" stop-color="#c9d8b7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#d8dccd"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#728273"/>
      <stop offset="1" stop-color="#3e5145"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#102017" flood-opacity=".22"/>
    </filter>
    <style>
      .rail { animation: rail 1.1s linear infinite; }
      .bird { animation: bob 1.25s ease-in-out infinite; }
      .neck { animation: lean 1.25s ease-in-out infinite; transform-origin: 615px 410px; }
      .scarf-tail { animation: flutter 1.05s ease-in-out infinite; transform-origin: 592px 356px; }
      .speed { animation: speed 1.1s ease-in-out infinite; }
      @keyframes rail { to { transform: translateX(-160px); } }
      @keyframes bob { 50% { transform: translateY(-7px); } }
      @keyframes lean { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.8deg); } }
      @keyframes flutter { 0%, 100% { transform: rotate(2deg) skewX(-3deg); } 50% { transform: rotate(-5deg) skewX(8deg); } }
      @keyframes speed { 0%, 100% { opacity: .2; transform: translateX(4px); } 50% { opacity: .75; transform: translateX(-8px); } }
      @media (prefers-reduced-motion: reduce) {
        .rail, .bird, .neck, .scarf-tail, .speed { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="976" cy="170" r="94" fill="#c9f75c"/>
  <circle cx="976" cy="170" r="118" fill="none" stroke="#789064" stroke-opacity=".34"/>
  <path d="M0 516C150 438 272 478 392 514C535 556 649 437 803 466C989 502 1051 470 1200 424V800H0Z" fill="#8fa27d"/>
  <path d="M0 594C136 528 259 548 392 590C549 640 669 531 824 555C1009 583 1088 557 1200 520V800H0Z" fill="#4c6957"/>
  <path d="M0 676C192 631 374 658 562 676C785 698 984 638 1200 650V800H0Z" fill="#17271e"/>
  <path d="M0 714C198 684 366 708 564 711C794 714 987 674 1200 688" fill="none" stroke="#c9f75c" stroke-width="5" stroke-dasharray="68 44" opacity=".88"/>
  <g class="rail" stroke="#eef1dc" stroke-width="4" stroke-linecap="round" opacity=".52">
    <path d="M40 754H280"/><path d="M390 754H630"/><path d="M740 754H980"/><path d="M1090 754H1330"/>
  </g>
  <g fill="none" stroke="#243e2d" stroke-width="5" stroke-linecap="round" opacity=".7">
    <path d="M120 216q24-22 48 0"/><path d="M184 186q20-18 40 0"/><path d="M1030 300q22-20 44 0"/>
  </g>

  <g class="speed" stroke="#f5f6e9" stroke-width="7" stroke-linecap="round">
    <path d="M90 414H238"/><path d="M62 468H178"/><path d="M118 522H218"/>
  </g>

  <ellipse cx="626" cy="704" rx="340" ry="30" fill="#0a110d" opacity=".28"/>
  <g filter="url(#shadow)">
    <g>
      <circle cx="402" cy="590" r="118" fill="#e8eadc" stroke="#132018" stroke-width="18"/>
      <circle cx="402" cy="590" r="92" fill="none" stroke="#132018" stroke-width="5" opacity=".72"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 402 590" to="360 402 590" dur="1.2s" repeatCount="indefinite"/>
        <g stroke="#132018" stroke-width="5" stroke-linecap="round">
          <path d="M402 502V678"/><path d="M314 590H490"/><path d="M340 528L464 652"/><path d="M464 528L340 652"/>
        </g>
        <circle cx="402" cy="590" r="15" fill="#c9f75c" stroke="#132018" stroke-width="5"/>
      </g>
    </g>
    <g>
      <circle cx="856" cy="590" r="118" fill="#e8eadc" stroke="#132018" stroke-width="18"/>
      <circle cx="856" cy="590" r="92" fill="none" stroke="#132018" stroke-width="5" opacity=".72"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 856 590" to="360 856 590" dur="1.2s" repeatCount="indefinite"/>
        <g stroke="#132018" stroke-width="5" stroke-linecap="round">
          <path d="M856 502V678"/><path d="M768 590H944"/><path d="M794 528L918 652"/><path d="M918 528L794 652"/>
        </g>
        <circle cx="856" cy="590" r="15" fill="#c9f75c" stroke="#132018" stroke-width="5"/>
      </g>
    </g>

    <g fill="none" stroke="#132018" stroke-linecap="round" stroke-linejoin="round">
      <path d="M402 590L532 442L638 590L402 590" stroke-width="15"/>
      <path d="M532 442L748 454L638 590" stroke-width="16"/>
      <path d="M748 454L790 416M638 590L790 416" stroke-width="15"/>
      <path d="M790 416L856 590" stroke-width="17"/>
      <path d="M790 416L830 386" stroke-width="13"/>
      <path d="M816 374Q838 360 854 382" stroke-width="12"/>
    </g>
    <path d="M532 442V416" fill="none" stroke="#132018" stroke-width="12"/>
    <path d="M487 412Q530 394 574 412Q540 428 487 412Z" fill="#c9f75c" stroke="#132018" stroke-width="6"/>
    <path d="M452 378L405 376M462 378L417 393" stroke="#132018" stroke-width="8" stroke-linecap="round"/>

    <g transform="translate(638 590)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <circle r="42" fill="none" stroke="#c9f75c" stroke-width="9"/>
        <circle r="12" fill="#132018"/>
        <path d="M0 0L0 55" stroke="#132018" stroke-width="9" stroke-linecap="round"/>
        <path d="M0 0L0 -55" stroke="#132018" stroke-width="9" stroke-linecap="round"/>
        <rect x="-20" y="49" width="40" height="14" rx="7" fill="#c9f75c" stroke="#132018" stroke-width="5"/>
        <rect x="-20" y="-63" width="40" height="14" rx="7" fill="#c9f75c" stroke="#132018" stroke-width="5"/>
      </g>
    </g>

    <g class="bird">
      <path d="M557 462Q518 505 541 530" fill="none" stroke="#263b2e" stroke-width="22" stroke-linecap="round"/>
      <path d="M590 474Q621 529 667 559" fill="none" stroke="#263b2e" stroke-width="20" stroke-linecap="round"/>
      <path d="M659 553L685 569L665 576" fill="#d77c45" stroke="#263b2e" stroke-width="5" stroke-linejoin="round"/>

      <g class="scarf-tail">
        <path d="M578 352C508 342 470 368 410 350C444 396 509 397 579 373Z" fill="#d6533d" stroke="#132018" stroke-width="6"/>
        <path d="M574 357C518 370 494 405 447 414C500 421 548 394 586 372Z" fill="#ec7955" stroke="#132018" stroke-width="6"/>
      </g>
      <path d="M568 347Q560 380 582 386Q598 370 594 350Z" fill="#d6533d" stroke="#132018" stroke-width="6"/>

      <path d="M514 391C517 342 566 315 624 328C680 341 702 390 681 440C662 486 609 506 558 485C524 471 511 437 514 391Z" fill="url(#body)" stroke="#132018" stroke-width="7"/>
      <path d="M543 370C579 345 630 363 646 405C621 438 573 451 534 424C525 404 530 385 543 370Z" fill="url(#wing)" stroke="#132018" stroke-width="6"/>
      <path d="M566 387C589 381 614 388 631 407" fill="none" stroke="#c5cdbf" stroke-width="6" stroke-linecap="round"/>
      <path d="M506 425Q478 438 452 432Q476 460 522 453" fill="#eef0e4" stroke="#132018" stroke-width="6" stroke-linejoin="round"/>

      <g class="neck">
        <path d="M626 366C636 330 654 309 686 300" fill="none" stroke="#f4f3e7" stroke-width="52" stroke-linecap="round"/>
        <path d="M626 366C636 330 654 309 686 300" fill="none" stroke="#132018" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 999"/>
        <circle cx="694" cy="299" r="45" fill="#f8f5e8" stroke="#132018" stroke-width="7"/>
        <path d="M711 281Q766 282 822 314Q770 344 711 329Z" fill="#e88448" stroke="#132018" stroke-width="7" stroke-linejoin="round"/>
        <path d="M719 325Q758 331 786 320Q758 367 717 351Z" fill="#efa27d" stroke="#132018" stroke-width="6" stroke-linejoin="round"/>
        <circle cx="713" cy="286" r="7" fill="#132018"/>
        <circle cx="715" cy="284" r="2.2" fill="#fff"/>

        <path d="M651 280C657 242 698 229 728 252C745 266 748 284 746 297Q700 274 651 292Z" fill="#1b2b22" stroke="#132018" stroke-width="7"/>
        <path d="M665 271Q697 253 728 270" fill="none" stroke="#c9f75c" stroke-width="7" stroke-linecap="round"/>
        <path d="M675 289Q692 311 715 303" fill="none" stroke="#132018" stroke-width="4"/>
      </g>
    </g>
  </g>

  <g transform="translate(72 72)">
    <rect width="244" height="56" rx="28" fill="#17271e"/>
    <circle cx="30" cy="28" r="7" fill="#c9f75c"/>
    <text x="50" y="34" fill="#f1f2e7" font-family="Microsoft YaHei, sans-serif" font-size="15" letter-spacing="1">SVG · MOTION STUDY</text>
  </g>
</svg>
