<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="0.65" stop-color="#e7f6ff"/>
      <stop offset="1" stop-color="#fdf6e3"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd06a"/>
      <stop offset="1" stop-color="#4f9b3c"/>
    </linearGradient>
    <linearGradient id="bodyShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ee"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc861"/>
      <stop offset="1" stop-color="#f2992f"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="520" fill="url(#sky)"/>
  <circle cx="672" cy="92" r="46" fill="#ffe38a" opacity="0.95"/>
  <circle cx="672" cy="92" r="70" fill="#ffe38a" opacity="0.22"/>

  <!-- 云 -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" values="900 0;-1100 0" dur="26s" repeatCount="indefinite"/>
      <ellipse cx="120" cy="96" rx="52" ry="26"/>
      <ellipse cx="166" cy="104" rx="38" ry="20"/>
      <ellipse cx="80" cy="108" rx="34" ry="18"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="760 0;-1000 0" dur="34s" repeatCount="indefinite"/>
      <ellipse cx="300" cy="62" rx="44" ry="22"/>
      <ellipse cx="342" cy="70" rx="30" ry="16"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="600 0;-1200 0" dur="44s" repeatCount="indefinite"/>
      <ellipse cx="520" cy="150" rx="46" ry="20"/>
      <ellipse cx="562" cy="156" rx="32" ry="15"/>
    </g>
  </g>

  <!-- 远山 -->
  <path d="M0 400 L120 300 L210 400 Z" fill="#b7d9b0"/>
  <path d="M160 400 L280 292 L400 400 Z" fill="#a6cd9e"/>
  <path d="M420 400 L560 306 L700 400 Z" fill="#b7d9b0"/>
  <path d="M620 400 L740 320 L830 400 Z" fill="#a6cd9e"/>

  <!-- 地面 -->
  <rect y="400" width="800" height="120" fill="url(#ground)"/>
  <g stroke="#3f8330" stroke-width="4" stroke-linecap="round" opacity="0.65"
     stroke-dasharray="26 40">
    <line x1="-60" y1="432" x2="860" y2="432">
      <animate attributeName="stroke-dashoffset" values="0;66" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="-60" y1="466" x2="860" y2="466" stroke-width="5">
      <animate attributeName="stroke-dashoffset" values="0;110" dur="0.65s" repeatCount="indefinite"/>
    </line>
    <line x1="-60" y1="502" x2="860" y2="502" stroke-width="6">
      <animate attributeName="stroke-dashoffset" values="0;150" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 影子 -->
  <ellipse cx="400" cy="408" rx="196" ry="15" fill="#2f6b25" opacity="0.28"/>

  <!-- 整车 + 骑手（轻微颠簸） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -16.5;0 -18.5;0 -16.5" dur="0.6s" repeatCount="indefinite"/>

    <!-- 后轮 -->
    <g>
      <circle cx="250" cy="340" r="72" fill="none" stroke="#2c2f36" stroke-width="9"/>
      <circle cx="250" cy="340" r="66" fill="none" stroke="#a9b3c1" stroke-width="3"/>
      <g stroke="#c9d2df" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" values="0 250 340;360 250 340" dur="0.7s" repeatCount="indefinite"/>
        <line x1="250" y1="276" x2="250" y2="404"/>
        <line x1="186" y1="340" x2="314" y2="340"/>
        <line x1="205" y1="295" x2="295" y2="385"/>
        <line x1="295" y1="295" x2="205" y2="385"/>
        <line x1="222" y1="286" x2="278" y2="394"/>
        <line x1="282" y1="282" x2="218" y2="398"/>
      </g>
      <circle cx="250" cy="340" r="8" fill="#8e99a8"/>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="545" cy="340" r="72" fill="none" stroke="#2c2f36" stroke-width="9"/>
      <circle cx="545" cy="340" r="66" fill="none" stroke="#a9b3c1" stroke-width="3"/>
      <g stroke="#c9d2df" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" values="0 545 340;360 545 340" dur="0.7s" repeatCount="indefinite"/>
        <line x1="545" y1="276" x2="545" y2="404"/>
        <line x1="481" y1="340" x2="609" y2="340"/>
        <line x1="500" y1="295" x2="590" y2="385"/>
        <line x1="590" y1="295" x2="500" y2="385"/>
        <line x1="517" y1="286" x2="573" y2="394"/>
        <line x1="577" y1="282" x2="513" y2="398"/>
      </g>
      <circle cx="545" cy="340" r="8" fill="#8e99a8"/>
    </g>

    <!-- 车架 -->
    <g fill="none" stroke="#e0453f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 340 L392 352"/>
      <path d="M250 340 L362 246"/>
      <path d="M362 246 L392 352"/>
      <path d="M362 246 L498 250"/>
      <path d="M392 352 L523 306"/>
      <path d="M498 250 L523 306"/>
    </g>
    <!-- 前叉 -->
    <path d="M498 250 L545 342" fill="none" stroke="#c9312c" stroke-width="10" stroke-linecap="round"/>
    <!-- 座垫直接坐在座管顶端，座杆完全被遮住，因此不单独绘制 -->
    <!-- 把立 + 车把 -->
    <path d="M498 250 L496 226" stroke="#8e99a8" stroke-width="8" stroke-linecap="round"/>
    <path d="M496 226 C516 214 534 220 534 236" fill="none" stroke="#33373f" stroke-width="9" stroke-linecap="round"/>
    <!-- 车铃 -->
    <circle cx="508" cy="224" r="7" fill="#f2c14e" stroke="#c99a2e" stroke-width="2"/>

    <!-- 后腿（远侧，先画） -->
    <path d="M356,236 L414.7,297.4 L359,352" fill="none" stroke="#c9822a" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
               values="M356,236 L414.7,297.4 L359,352;
                       M356,236 L429.1,279.4 L368.7,328.7;
                       M356,236 L438.5,256.4 L392,319;
                       M356,236 L439,254.3 L415.3,328.7;
                       M356,236 L431.9,274.3 L425,352;
                       M356,236 L414.8,297.3 L415.3,375.3;
                       M356,236 L401.8,307.6 L392,385;
                       M356,236 L404.3,305.9 L368.7,375.3;
                       M356,236 L414.7,297.4 L359,352"/>
    </path>

    <!-- 远侧踏板：踏板保持水平（不跟曲柄一起翻转） -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="1.2s" repeatCount="indefinite"
                        calcMode="linear" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                        values="359,352;368.7,328.7;392,319;415.3,328.7;425,352;415.3,375.3;392,385;368.7,375.3;359,352"/>
      <rect x="-13" y="-7" width="26" height="14" rx="4" fill="#2b2e35"/>
    </g>
    <!-- 远侧脚掌：贴在对侧踏板顶面 -->
    <g opacity="0.82">
      <animateTransform attributeName="transform" type="translate" dur="1.2s" repeatCount="indefinite"
                        calcMode="linear" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                        values="359,352;368.7,328.7;392,319;415.3,328.7;425,352;415.3,375.3;392,385;368.7,375.3;359,352"/>
      <ellipse cy="-5" rx="16" ry="8" fill="#d99a3d" stroke="#8a4f14" stroke-width="2.5"/>
      <path d="M-5,-9 L10,-12 M-5,-4 L11,-4 M-5,1 L10,4" fill="none" stroke="#8a4f14"
            stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- 链条：牙盘 → 飞轮，下侧走链加一点流动 -->
    <circle cx="250" cy="340" r="12" fill="none" stroke="#7f8895" stroke-width="4"/>
    <line x1="250" y1="329" x2="392" y2="331" stroke="#7f8895" stroke-width="3"/>
    <line x1="250" y1="351" x2="392" y2="373" stroke="#7f8895" stroke-width="3"
          stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="0.25s" repeatCount="indefinite"/>
    </line>

    <!-- 曲柄（牙盘 + 两根曲柄臂） -->
    <g transform="translate(392,352)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="1.2s" repeatCount="indefinite"/>
        <circle r="22" fill="none" stroke="#9aa4b2" stroke-width="5"/>
        <line x1="-32" y1="0" x2="32" y2="0" stroke="#8e99a8" stroke-width="7" stroke-linecap="round"/>
        <circle r="6" fill="#6b7482"/>
      </g>
    </g>

    <!-- 近侧踏板（水平） -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="1.2s" repeatCount="indefinite"
                        calcMode="linear" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                        values="425,352;415.3,375.3;392,385;368.7,375.3;359,352;368.7,328.7;392,319;415.3,328.7;425,352"/>
      <rect x="-13" y="-7" width="26" height="14" rx="4" fill="#33373f"/>
    </g>

    <!-- 前腿（近侧，随踏板） -->
    <path d="M356,236 L431.9,274.3 L425,352" fill="none" stroke="#e8a13c" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
               values="M356,236 L431.9,274.3 L425,352;
                       M356,236 L414.8,297.3 L415.3,375.3;
                       M356,236 L401.8,307.6 L392,385;
                       M356,236 L404.3,305.9 L368.7,375.3;
                       M356,236 L414.7,297.4 L359,352;
                       M356,236 L429.1,279.4 L368.7,328.7;
                       M356,236 L438.5,256.4 L392,319;
                       M356,236 L439,254.3 L415.3,328.7;
                       M356,236 L431.9,274.3 L425,352"/>
    </path>
    <!-- 近侧脚掌（比腿亮一档 + 深色蹼纹，避免被看成腿的圆头） -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="1.2s" repeatCount="indefinite"
                        calcMode="linear" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                        values="425,352;415.3,375.3;392,385;368.7,375.3;359,352;368.7,328.7;392,319;415.3,328.7;425,352"/>
      <ellipse cy="-5" rx="16" ry="8" fill="#f7c164" stroke="#a3611a" stroke-width="2.5"/>
      <path d="M-5,-9 L10,-12 M-5,-4 L11,-4 M-5,1 L10,4" fill="none" stroke="#a3611a"
            stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- 尾巴 -->
    <path d="M300,190 L240,164 L254,196 L236,220 L302,216 Z"
          fill="#eef3f8" stroke="#cfd8e3" stroke-width="2" stroke-linejoin="round"/>

    <!-- 身体 -->
    <ellipse cx="348" cy="202" rx="66" ry="52" fill="url(#bodyShade)"
             stroke="#cfd8e3" stroke-width="2" transform="rotate(-12 348 202)"/>

    <!-- 座垫（画在身体之后，让座垫从臀部下方露出来，避免看起来悬空） -->
    <ellipse cx="352" cy="252" rx="36" ry="9" fill="#33373f" transform="rotate(-6 352 252)"/>

    <!-- 脖子 -->
    <path d="M382,162 C400,132 416,114 436,106" fill="none" stroke="#cfd8e3"
          stroke-width="29" stroke-linecap="round"/>
    <path d="M382,162 C400,132 416,114 436,106" fill="none" stroke="#ffffff"
          stroke-width="25" stroke-linecap="round"/>

    <!-- 头 -->
    <circle cx="440" cy="104" r="26" fill="#ffffff" stroke="#cfd8e3" stroke-width="2"/>
    <path d="M424,84 C418,70 428,66 432,78" fill="none" stroke="#dfe6ee" stroke-width="4"
          stroke-linecap="round"/>

    <!-- 喙：上喙 + 喉囊 -->
    <path d="M456,100 L604,130 L594,143 L454,118 Z" fill="#f6b93b"
          stroke="#d99426" stroke-width="2" stroke-linejoin="round"/>
    <path d="M456,116 L598,140 C556,186 470,184 456,116 Z"
          fill="url(#pouch)" stroke="#d99426" stroke-width="2" stroke-linejoin="round">
      <animate attributeName="d" dur="0.6s" repeatCount="indefinite" calcMode="spline"
               keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
               values="M456,116 L598,140 C556,186 470,184 456,116 Z;
                       M456,116 L598,140 C556,204 470,202 456,116 Z;
                       M456,116 L598,140 C556,186 470,184 456,116 Z"/>
    </path>

    <!-- 眼睛 -->
    <circle cx="448" cy="92" r="5.5" fill="#2b2f36"/>
    <circle cx="446" cy="90" r="1.8" fill="#ffffff" opacity="0.85"/>

    <!-- 翅膀：抓住车把 -->
    <path d="M368,176 C418,164 472,192 536,230 C540,240 530,248 520,243 C468,222 418,206 370,206 Z"
          fill="#f4f8fc" stroke="#c3cedb" stroke-width="2" stroke-linejoin="round"/>
    <path d="M400,196 C450,200 492,214 522,232" fill="none" stroke="#d7e0ea" stroke-width="2"/>
    <path d="M392,208 C440,212 480,224 512,240" fill="none" stroke="#d7e0ea" stroke-width="2"/>
    <ellipse cx="532" cy="236" rx="11" ry="8" fill="#f4f8fc" stroke="#c3cedb" stroke-width="2"
             transform="rotate(-15 532 236)"/>
  </g>
</svg>
